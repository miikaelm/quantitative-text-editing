# Example PipelineConfig — mixed multi-type generation run.
#
# Usage:
#   python src/gen_pipeline/generate.py --config configs/gen_mixed.yaml
#
# output_dir/pairs.jsonl is appended on repeated runs.

output_dir: data/test_01
seed: 42

counts:
  color: 5
  scaling: 3
  typography: 3
  alignment: 2
  rotation: 2

render:
  width: 1024
  height: 1024
  downscale_to: 512
  disable_animations: true
